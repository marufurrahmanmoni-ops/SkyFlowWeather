name: skyflow_weather
description: "SkyFlow Weather - interactive weather maps, forecasts, model comparison, radar, satellite and alerts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_riverpod: ^3.5.0
  dio: ^5.9.0
  maplibre_gl: ^0.28.0
  fl_chart: ^1.3.1
  geolocator: ^14.0.2
  sqflite: ^2.4.2
  path: ^1.9.0
  flutter_local_notifications: ^23.0.0
  workmanager: ^0.10.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.14.1
  home_widget: ^0.10.0
  flutter_tts: ^4.2.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
